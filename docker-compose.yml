version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: clock_postgres_dev
    environment:
      POSTGRES_USER: clock_user
      POSTGRES_PASSWORD: clock_pass
      POSTGRES_DB: clock
    ports:
      - "5433:5432"
    volumes:
      - clock_postgres_data:/var/lib/postgresql/data
    networks:
      - clock_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clock_user -d clock"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./clock-backend
      dockerfile: Dockerfile
    container_name: clock_backend_dev
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=clock_user
      - DB_PASSWORD=clock_pass
      - DB_NAME=clock
      - DB_SSLMODE=disable
      - JWT_SECRET=development-secret-key-change-in-production
      - JWT_REFRESH_SECRET=development-refresh-secret-key-change-in-production
      - JWT_EXPIRATION=2592000
      - JWT_REFRESH_EXPIRATION=2592000
      - PORT=8080
      - ENV=development
      - LOG_LEVEL=debug
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - clock_network
    restart: unless-stopped

  frontend:
    build:
      context: ./clock-frontend
      dockerfile: Dockerfile.dev
    container_name: clock_frontend_dev
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - clock_network
    volumes:
      - ./clock-frontend:/app
      - /app/node_modules
    restart: unless-stopped

networks:
  clock_network:
    driver: bridge

volumes:
  clock_postgres_data:
